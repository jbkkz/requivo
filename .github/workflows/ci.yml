name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (a new push to a PR supersedes the previous).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Declared at workflow level rather than per job, so a job added later inherits read-only instead of
# falling back to the repository default -- which is read/write in a repository whose owner has
# never changed it (#178). Not one of the jobs below writes anything through the API: they check
# out, install, lint, type-check and run pytest. A branch pull request runs contributor Python
# here, which is what makes the default worth narrowing even with nothing known to be exploitable
# through it. See tests/test_workflow_permissions.py.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts

  # The compatibility axis: every supported Python, on one OS. Deliberately left with its original
  # job name and matrix shape — `main`'s branch protection requires these five checks by their exact
  # names (`Test (py3.9)` … `Test (py3.13)`), so folding an `os` axis in here would rename all five,
  # none of the required checks would ever report again, and no pull request could merge. The
  # platform axis is a separate job below for that reason.
  #
  # `3.14` was added as a sixth matrix entry (#298, step 1 of 2) rather than folded into a floor
  # decision -- it is purely additive, a new job name (`Test (py3.14)`) beside the existing five, and
  # does not touch `requires-python`, `[tool.ruff] target-version`, `[tool.pyright] pythonVersion` or
  # the platform matrix's low end. Whether to *raise the floor* off 3.9 (EOL, and this repo's own
  # carrying costs for it are real -- see invariant 17's 3.9-Windows realpath narrative) is step 2,
  # deliberately deferred until pypistats download data says who is actually still on it. This leg
  # is not yet in the branch-protection required-checks list -- appending it there is a documented
  # manual step (see the note on the platform-axis job below) and is out of scope for this change.
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Pure-logic + offline CLI units, no API calls (a fake client is injected), so no key needed.
      # `-rs` so a skip prints its reason: this suite skips loudly on purpose in several places
      # (a platform that will not create a symlink, an interpreter where an encoding lever cannot be
      # forced), and a skip whose reason nobody can see is indistinguishable from a test that ran.
      - run: python -m pytest tests/ -q -rs
      # Coverage (#295). Three properties, each of them load-bearing:
      #
      # `continue-on-error: true` -- **this step cannot change this leg's verdict**, and `Test
      # (py3.12)` is a required check, so that is not a nicety. There is deliberately no
      # `--cov-fail-under`: a percentage gate invites padding, and a padded number that has passed a
      # check is worse than no number at all. The reasoning, and what the config deliberately omits,
      # is in pyproject.toml's `[tool.coverage.run]`.
      #
      # `if: matrix.python-version == '3.12'` -- one leg, not the whole matrix. The table does not
      # differ by interpreter, so running it on every leg buys one report several times over and
      # costs a second full suite run on each. 3.12 rather than the newest: it is the interpreter the
      # single-instance jobs in this file already pin (lint, types, floor, wheel), and it is a
      # required check, so the report is produced on every pull request rather than on a leg that is
      # additive and could be dropped.
      #
      # A second pytest run rather than folding `--cov` into the one above, and the doubling is the
      # cheaper half of the trade: instrumenting the required run would make this leg's pass/fail
      # depend on pytest-cov working, which is the gate this issue exists to not build.
      #
      # `--cov=requivo` is the form #295's own acceptance criterion names, so the command a
      # maintainer types locally is the command this leg runs. A bare `--cov` is equivalent -- the
      # `source` in `[tool.coverage.run]` resolves to the same files -- and both are measured.
      - name: Coverage report (non-gating, for reading)
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: python -m pytest tests/ -q --cov=requivo --cov-report=term-missing

  # The platform axis (#3). Every job in every workflow was `ubuntu-latest` and the only matrix axis
  # anywhere was `python-version`, so no leg had ever executed this code on the platform most users
  # install it on. #11 and #29 are what that gap cost: every read decoded with the platform's codec
  # while every write encoded UTF-8, so a French session round-tripped into mojibake on Windows and
  # `session verify` then accused the user of editing a file nobody had touched. Both shipped, and
  # three separate audits graded them *reasoned* rather than observed for the same reason each time
  # — there was no leg that could run them.
  #
  # The ends of the supported range rather than every minor version, and the ends are the point: a
  # platform's own standard library can differ between them. Windows on 3.9 cannot resolve a symlink
  # whose target does not exist, where Windows on 3.13 can — which left a containment guard holding
  # on twelve of these thirteen legs and not on the thirteenth (#3, #11). A difference in the
  # language itself is covered above, on all five. 4 legs rather than 10.
  #
  # REQUIRED by branch protection since #55 merged. Adding a leg to this file does **not** add it to
  # `main`'s required-check list; that is a separate API call a maintainer makes by hand, and the
  # endpoint's failure mode is a silent 200. The command, the wrong verb it is easy to reach for, and
  # what that verb would have cost are in `decision: appending-a-required-check` — moved out of this
  # file under #75, because it is a fact about a GitHub endpoint and no test here can go red for it.

  test-platforms:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Deliberately NOT run under a forced UTF-8 mode. `tests/test_encoding.py` spawns subprocesses
      # that set PYTHONIOENCODING and PYTHONWARNDEFAULTENCODING themselves, and a PYTHONUTF8=1 in the
      # job environment would be inherited by those children and override every lever they use —
      # turning the whole encoding suite green for the wrong reason, on the one platform it exists to
      # measure.
      # `-rs` so a skip prints its reason: this suite skips loudly on purpose in several places
      # (a platform that will not create a symlink, an interpreter where an encoding lever cannot be
      # forced), and a skip whose reason nobody can see is indistinguishable from a test that ran.
      - run: python -m pytest tests/ -q -rs

  types:
    name: Types (pyright)
    runs-on: ubuntu-latest
    # #78. Ruff and pytest were the whole static story, on a codebase whose architectural safety is
    # expressed in types: Pydantic contracts at every boundary with `StrictModel` and
    # `PersistedEngineOutput` deliberately disagreeing, `Protocol` seams that nothing structural
    # checks, and a store where `Optional` means *could not read* rather than *empty* — which is the
    # distinction this whole project is organised around. A test finds those only where a test
    # happens to run the path.
    #
    # It paid before the leg existed. The first run reported eight errors in one function, all the
    # same fact: `DiscoveryService.generate` handed a revision-0 session's `None` model straight to
    # the provider, and the only guard for it lived in a Web route (#152).
    #
    # **Blocking rather than advisory, because it is clean.** The issue proposed advisory first and
    # promote once the scoped layers are green; they are green now, and a permanently-advisory leg is
    # one people learn to scroll past. Scope and the reason for every config key are in
    # pyproject.toml's [tool.pyright], next to the keys -- and deliberately not in a standalone
    # pyright config file, which the checker would prefer over them if one existed.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # A `.venv` rather than the runner's interpreter, and it is not ceremony: [tool.pyright]
      # names `venvPath`/`venv` so the checker resolves `pydantic` instead of reporting it as an
      # unresolved import — and building the same layout here means the command a maintainer types
      # locally is the command this leg runs. A check only its own leg can run is verified by
      # nothing but the leg it feeds.
      - name: Build the venv the checker resolves against
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pyright

  floor:
    name: Dependency floor
    runs-on: ubuntu-latest
    # pyproject's lower bounds are a promise to whoever runs `pip install requivo`, and until this
    # leg existed nothing installed one of them (#91): every other job runs `pip install -e ".[dev]"`
    # and gets the newest satisfying release, so the floors were measured nowhere.
    #
    # It found a real one on its first run. `pydantic>=2.0` was false by eleven minor versions — the
    # package does not import at all on 2.0.x — and the v0.11.0 audit had cleared that same bound by
    # confirming `SerializeAsAny` is exported by 2.0.0. A symbol existing is not the symbol working,
    # and only installing the thing tells them apart.
    #
    # One interpreter, once per push. The class does not vary by Python version, and a matrix here
    # would multiply a resolve that deliberately picks the oldest release of everything.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # `uv` from PyPI rather than `astral-sh/setup-uv`, and the reason is worth a line: that action
      # publishes a moving major tag only up to `v7` while its newest release is `v10.0.1`, so
      # `@v10` does not resolve and `@v7` is three majors behind. `pip install uv` has no such
      # archaeology, and the action's only job here is to put one binary on PATH.
      - run: pip install uv
      # `uv --resolution lowest-direct`, not a generated constraints file. A `name==floor` pin was
      # tried first and is wrong twice: `jinja2==3.1` names no release that exists (the oldest is
      # 3.1.0), and pydantic's oldest *installable* release is not the one its bound names. The floor
      # a user actually gets is whatever a resolver picks when it prefers the oldest, so that is what
      # gets installed. `lowest-direct` leaves transitive dependencies at their newest, which is the
      # shape of the promise: these bounds are ours, the ones underneath them are not.
      #
      # `--python "$(which python)"` rather than `--system`: setup-python puts its interpreter first
      # on PATH, and naming it leaves no question about which environment the floors landed in — the
      # one the verify step and pytest then read.
      - name: Install the package at its declared floors
        run: uv pip install --python "$(which python)" --resolution lowest-direct -e ".[dev]"
      # Asking a resolver for the oldest releases is a request, not an outcome: drop the flag, or
      # install an extra in a second command without it, and the environment comes back at the newest
      # of everything with this leg still green over it. So the answer is read back out of the
      # environment that was actually built.
      - name: Verify the environment really is at the floor
        run: python scripts/dependency_floor.py --verify
      - run: python -m pytest tests/ -q -rs

  wheel:
    name: Wheel install (no clone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Build the wheel, install it into a clean venv, and drive it from a directory that is NOT the
      # repo — so nothing resolves via the source tree. This guards the packaging invariant: the
      # bundled assets (prompts, schema, context cards, demo payload) must ship inside the wheel, or a
      # real `pip install` outside the clone would break on the first command that builds a prompt.
      - run: pip install build
      - run: python -m build --wheel
      - name: Install the wheel into a clean venv and exercise it outside the repo
        run: |
          python -m venv /tmp/cleanenv
          /tmp/cleanenv/bin/pip install dist/*.whl
          mkdir /tmp/workdir && cd /tmp/workdir
          # requivo demo: offline replay from the bundled payload (no API key).
          /tmp/cleanenv/bin/requivo demo | grep -q "REQUIVO — DEMO"
          # Schema loads and every prompt builds from the installed package (not the source tree).
          /tmp/cleanenv/bin/python - <<'PY'
          from requivo.core.contracts import schema_slot_ids
          from requivo.core.context import build_prompt, available_cards
          allowed, _ = schema_slot_ids()
          assert len(allowed) > 0, "schema failed to load from the installed wheel"
          assert available_cards(), "no context cards found in the installed wheel"
          for name in ("engine.md", "brief.md", "prd.md", "stories.md",
                       "estimate.md", "criteria.md", "epic.md", "release.md"):
              p = build_prompt(name)
              assert "{{SCHEMA}}" not in p and "{{CONTEXT}}" not in p, f"{name} did not substitute"
          print("wheel install OK:", len(allowed), "slots,", len(available_cards()), "cards, 8 prompts")
          PY
      - name: Verify the web interface ships and serves from the installed wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          # Install the wheel WITH the [web] extra (+ httpx for the TestClient smoke), still outside the repo.
          /tmp/cleanenv/bin/pip install "${WHEEL}[web]" httpx
          cd /tmp/workdir
          /tmp/cleanenv/bin/requivo web --help >/dev/null   # the CLI command exists without the source tree
          /tmp/cleanenv/bin/python - <<'PY'
          from pathlib import Path
          import requivo.web
          from requivo.web.templating import TEMPLATES_DIR, STATIC_DIR
          # Templates + the vendored HTMX must be inside the installed package (not the checkout).
          assert (TEMPLATES_DIR / "base.html").exists(), "web templates missing from the wheel"
          assert (STATIC_DIR / "vendor" / "htmx.min.js").exists(), "vendored HTMX missing from the wheel"
          assert (STATIC_DIR / "css" / "app.css").exists(), "web CSS missing from the wheel"
          from fastapi.testclient import TestClient
          from requivo.web.app import create_app
          # TestClient defaults to host "testserver", which the cross-site guard correctly refuses —
          # the server answers only to loopback unless REQUIVO_ALLOWED_HOSTS says otherwise. Addressing
          # it as a real local caller does is the point of the smoke test; the previous version asserted
          # 200 against a host the guard is *supposed* to reject, and had been red since 0.9.3.
          client = TestClient(create_app(), base_url="http://127.0.0.1:8765")
          r = client.get("/health")
          assert r.status_code == 200 and r.json()["status"] == "ok", r.text
          # And the guard itself must still be doing its job from the installed wheel.
          rejected = TestClient(create_app(), base_url="http://evil.example",
                                raise_server_exceptions=False).get("/health")
          assert rejected.status_code == 403, f"cross-site guard not active: {rejected.status_code}"
          print("web wheel OK: templates + static shipped, /health 200, cross-site guard 403")
          PY
