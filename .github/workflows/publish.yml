name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token is stored anywhere. PyPI verifies
# the run's short-lived OIDC identity against a publisher you declare once on pypi.org.
#
# Triggers:
#   - a published GitHub Release  → every future release auto-publishes
#   - manual dispatch             → publish a tag on demand, but only a tag: the workflow refuses to
#                                   run against an untagged commit (see the version guard below)
#
# A publish is irreversible — PyPI never lets a version number be reused, even after a delete — so the
# gates run *before* the upload. Each one is a thing that has shipped wrong in a Python project at
# least once: a version that disagrees with its tag, a failing test suite nobody re-ran, a lint error
# waved through, a wheel that imports fine from the checkout and not outside it.
#
# Every `uses:` here is pinned to a **commit SHA**, and this is the one workflow in the repository
# where that is worth the friction. This job holds `id-token: write` — it mints the short-lived OIDC
# identity PyPI trusts in place of a stored token — so whatever runs inside it can publish `requivo`
# irreversibly. A tag is a mutable pointer and a branch is more mutable still, and the publish step
# consumed a *branch* (`@release/v1`); repointing any of the three upstream would put attacker code
# next to that identity. The rest of the chain is reasoned about carefully so that this step can be
# trusted, which is precisely why the mutable ref here was its weakest link (#214).
#
# The cost, stated rather than discovered: this workflow no longer follows an upstream fix on its
# own. Dependabot's github-actions ecosystem does move SHA pins, opening a reviewable PR with the
# version comment rewritten, which is the intended maintenance path — and against `pypa`'s branch ref
# it now tracks releases rather than whatever that branch last pointed at.
#
# The version comment beside each SHA is documentation, not a constraint: GitHub resolves the SHA and
# never reads the comment. If the two disagree, the SHA is what ran.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.9.8). Must exist and match the version in pyproject.toml."
        required: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/requivo
    # Job-level rather than workflow-level, and deliberately not matched to the one-line
    # `contents: read` the other three workflows took under #178: naming any permission on a job
    # replaces the whole set rather than adding to it, so a workflow-level block here would be
    # discarded by this one and read as a guarantee it does not give.
    #
    # `contents: read` is stated because this job checks out a tag and nothing else here grants it.
    # Without it `contents` is implicitly `none` and the checkout works only because the repository
    # is public — a property of the repository rather than of this file, and the wrong thing for a
    # publish to depend on. Widening none → read cannot affect what the job is able to publish.
    permissions:
      contents: read    # `actions/checkout` reads the tag this publishes; nothing here writes
      id-token: write   # mint the OIDC token Trusted Publishing uses — this is what replaces a token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Publish exactly the tagged commit, never whatever happens to be on the default branch.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Check the tag exists and agrees with the version
        # Three places state the version — the git tag, pyproject.toml and `requivo.__version__` — and
        # nothing keeps them in step but this check. A mismatch here costs a re-run; a mismatch on
        # PyPI costs the version number.
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}"
          git rev-parse "refs/tags/$TAG" >/dev/null 2>&1 || { echo "::error::tag $TAG does not exist"; exit 1; }
          PYPROJECT=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          DUNDER=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/requivo/__init__.py').read_text()).group(1))")
          echo "tag=$TAG  pyproject=$PYPROJECT  __version__=$DUNDER"
          [ "$TAG" = "v$PYPROJECT" ] || { echo "::error::tag $TAG != v$PYPROJECT (pyproject.toml)"; exit 1; }
          [ "$PYPROJECT" = "$DUNDER" ] || { echo "::error::pyproject $PYPROJECT != __version__ $DUNDER"; exit 1; }

      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        # The same scope as ci.yml's lint leg, deliberately: a release gate narrower than the merge
        # gate is one that waves through exactly what the merge gate would have caught.
        run: ruff check src tests scripts

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Verify the wheel installs and runs outside the repo
        # Outside the repo, because a wheel missing package data still works from a checkout — the
        # files are simply found on disk. This is the check that catches an unshipped asset.
        run: |
          python -m venv /tmp/verifyenv
          /tmp/verifyenv/bin/pip install "$(ls dist/*.whl)[web]"
          cd /tmp && /tmp/verifyenv/bin/requivo demo | grep -q "REQUIVO — DEMO"
          cd /tmp && /tmp/verifyenv/bin/requivo doctor --json > /dev/null
          cd /tmp && /tmp/verifyenv/bin/python -c "
          from requivo.web.templating import STATIC_DIR, TEMPLATES_DIR
          assert (TEMPLATES_DIR / '_csrf.html').is_file(), 'web templates missing from the wheel'
          assert (STATIC_DIR / 'vendor' / 'htmx.min.js').is_file(), 'vendored htmx missing from the wheel'
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
