name: Secret scan

# Lightweight defence-in-depth: flag credentials accidentally committed to the repo or a PR.
# This complements (does not replace) GitHub's own push protection / secret scanning, which should
# also be enabled in the repository settings.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# #178. `contents: read` for the checkout, and `pull-requests: write` because gitleaks-action's
# whole use of GITHUB_TOKEN is `pulls.createReviewComment` -- `GITLEAKS_ENABLE_COMMENTS` defaults to
# true, so a bare `contents: read` here would silently stop the scanner reporting on the pull
# request it just scanned. Read out of the action's own README at both `master` and the `v3` tag,
# on 2026-08-23, rather than inferred from the action's name.
#
# Turning the comments off instead would be a narrower grant and a different product decision, and
# nobody asked for one: what #178 wants is that the capability be explicit and reviewable, not that
# it be removed. See tests/test_workflow_permissions.py, whose allowlist carries this reason too.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a secret introduced in an earlier commit is still caught.
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
