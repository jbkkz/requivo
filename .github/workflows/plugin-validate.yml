name: Plugin manifests

# Runs `claude plugin validate` over both manifests this repo ships: the plugin
# (`plugins/claude-code/.claude-plugin/plugin.json`) and the distribution catalog
# (`.claude-plugin/marketplace.json`). Before this leg existed nothing ran the validator at
# all, in either mode, on either file — so the marketplace manifest had been failing
# `--strict` for a whole release with nothing saying so (#92).
#
# ── Is `--strict` the gate, or are warnings advisory here? ────────────────────────────────
#
# `--strict` is the gate, against a pinned CLI. A second run against `@latest` is advisory
# and cannot fail the build. The reasoning, since #92 asks for it in writing:
#
# 1. Plain `claude plugin validate` is not a gate. It exits 0 on "Validation passed with
#    warnings", and *warning* is the class this leg exists to catch — missing metadata and
#    unrecognized fields both arrive as warnings. Measured on this repo: the missing
#    top-level marketplace `description` printed a warning and exited 0. A non-strict leg
#    would have been green for the entire life of the bug it was added to catch.
#
# 2. The cost of `--strict` is real and is not about our files. Claude Code ignores
#    top-level fields it does not recognize, and the validator reports them as warnings —
#    so a manifest written against a *newer* plugin spec goes red against an *older* CLI
#    under `--strict`. That failure lands on someone else's release schedule, on a pull
#    request that touched nothing near a manifest. A required check that reddens for
#    reasons the author cannot act on is a check that gets overridden, then ignored, then
#    deleted.
#
# 3. So the gate pins an exact CLI version. The only two things that can change the gate's
#    answer are a manifest we edited and a pin we bumped on purpose — both of which are a
#    line in a diff somebody reviewed.
#
# 4. A pin goes stale in the other direction: a marketplace reviewer runs *their* current
#    CLI, not ours. The advisory step re-runs the same two commands against `@latest` with
#    `continue-on-error`, and annotates the run. It is how spec drift gets discovered here,
#    on an ordinary pull request, instead of during a submission — which is the failure
#    mode #92 asked us to have an opinion about rather than meet in person.
#
# ── "Gate" here means the MODE, not the merge button ──────────────────────────────────────
#
# Read literally, "gate" above is a claim this file cannot make on its own -- it is a statement
# about branch protection, which lives on the forge and not in this file. When this leg was
# written `main` required 13 checks and this job was not one of them, so a red result here was
# visible on the pull request and did not block the merge.
#
# That is no longer true, and the sentence is corrected rather than deleted because the reasoning
# above still depends on knowing which state we are in. Measured 2026-08-21:
# `gh api repos/jbkkz/requivo/branches/main/protection/required_status_checks --jq '.contexts'`
# returns **14**, and `Plugin manifests (validate --strict)` is among them. The owner ran the
# append below. A red result in THIS job now blocks the merge, which is what makes the pinned-CLI
# decision above load-bearing rather than advisory in practice.
#
# The `Plugin vs released CLI (advisory)` job further down is NOT in that list and is not intended
# to be; see its own header. The decision recorded above is which *mode* the leg runs in; making a
# job blocking is one API call, and it is the repository owner's to make:
#
#   gh api -X POST repos/jbkkz/requivo/branches/main/protection/required_status_checks/contexts \
#     -f 'contexts[]=Plugin manifests (validate --strict)'
#
# Use that endpoint, not `PATCH .../required_status_checks` with `contexts[]` — PATCH
# *replaces* the list rather than extending it, answers 200 either way, and would silently
# cut the required checks to the one name it carries. `ci.yml` documents the same trap at
# length. Read the list back either side and compare the counts (13 → 14):
#
#   gh api repos/jbkkz/requivo/branches/main/protection/required_status_checks --jq '.contexts | length'
#
# ── Notes on the install and the platform ─────────────────────────────────────────────────
#
# `npm install -g @anthropic-ai/claude-code@<version>` is the documented CI install and the
# only one that pins. (The alternative, `curl -fsSL https://claude.ai/install.sh | bash`,
# pipes a remote script into a shell and takes no version.) The package resolves a
# platform-native optional dependency in its postinstall; on this runner that is
# `@anthropic-ai/claude-code-linux-x64`, a glibc x86-64 ELF of about 320 MB, which is where
# this job spends most of its wall clock. `claude plugin validate` is a static check: it
# needs no login, no ANTHROPIC_API_KEY and no network beyond the install.
#
# `ubuntu-latest` only, and unlike `ci.yml` that is a decision rather than an oversight —
# ci.yml's own header records what an unstated `ubuntu-latest`-only assumption cost this
# project twice (#11, #29), so it is worth saying why this one is different. What this leg
# measures is two static JSON documents against a spec; the answer is a property of the
# files, not of the OS reading them, and no code of ours runs here at all. The one
# platform-sensitive thing in reach is line endings, and a CRLF checkout is still valid
# JSON — `\r` between tokens is legal whitespace. The cost of being wrong is also small:
# these files are read on every platform by `tests/test_plugin.py`, which does run on all
# four legs of the matrix. Adding an `os` axis here would triple a 320 MB install to
# re-answer a question about file contents.
#
# Deliberately no `paths:` filter. A path-filtered check never reports on a pull request
# that misses the filter, and GitHub treats a required check that never reports as pending
# forever — so filtering here would block every unrelated merge the day this leg is added
# to branch protection.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: plugin-validate-${{ github.ref }}
  cancel-in-progress: true

# Declared at workflow level rather than per job, so a job added later inherits read-only instead
# of falling back to the repository default -- which is read/write in a repository whose owner has
# never changed it (#178). Neither job here writes anything through the API: they check out, install
# tools, and annotate the run, and an annotation is a log line rather than a token-authenticated
# call. `.github/workflows/oss-changelog.yml` reached the same answer first and this matches it.
#
# A `pull_request` from a fork already gets a read-only token whatever this says. The grant that
# matters is the one on a BRANCH pull request and on `push: main`, where the default is otherwise
# read/write for steps that have no use for it. See tests/test_workflow_permissions.py.
permissions:
  contents: read

env:
  # The pinned gate. Bump deliberately, and read the advisory step's output when you do.
  CLAUDE_CLI_VERSION: "2.1.238"

jobs:
  validate:
    name: Plugin manifests (validate --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Both manifests are checked for existence first, because `claude plugin validate`
      # answers exit 1 for a missing file exactly as it does for a manifest it read and
      # refused. Asserting the files are there turns "the checkout is wrong" into its own
      # message instead of leaving it to arrive dressed as a validation failure.
      - name: Both manifests are present
        run: |
          set -eu
          for f in plugins/claude-code/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            [ -f "$f" ] || { echo "missing manifest: $f" >&2; exit 1; }
            echo "found $f"
          done

      # ── Everything below runs a third-party binary into a log the runner parses (#177) ──────
      #
      # Two forms, and neither of the obvious defences covers both: `::name::` is tested after the
      # runner calls `TrimStart()`, so indenting contains nothing, and the legacy `##[name]` is an
      # unanchored `IndexOf("##[")`, so collapsing onto one line contains nothing either. A fork
      # pull request controls the field names in `plugins/claude-code/.claude-plugin/plugin.json`
      # and in `.claude-plugin/marketplace.json`, and `claude plugin validate` echoes an unknown
      # field name VERBATIM, twice, in its warning line. Measured 2026-08-23 against `claude`
      # 2.1.241: a field named `benign##[error]title=X::y` comes back with `##[` at column 10 of a
      # line the runner acts on. The advisory step below has been fenced since #147/#175 for this
      # same reason; these three steps were the ones it did not cover.
      #
      # ── Why fencing a GATE is not the same edit as fencing the advisory step ─────────────────
      #
      # The advisory step is `continue-on-error: true` and ends `exit 0`, so nothing it does with
      # `$?` matters. These are the other shape: the two gates are required, branch-protected
      # checks whose verdict IS the process exit code, and `echo` clobbers `$?`. Written as
      # open-fence / run / close-fence, a failed gate would report success -- trading a log-forging
      # problem for a required check that cannot fail, which is strictly the worse outcome. So the
      # code is captured while it still exists and re-raised as the step's own, which is why each
      # block below ends `exit "$code"`.
      #
      # That re-raise is also what takes the containment off the shell's flags. GitHub runs a
      # `run:` block with `bash -e {0}` when the workflow names no `shell:` key, and this file
      # names none -- but nothing here depends on it: `|| code=$?` plus an explicit `exit` behaves
      # identically with errexit off. `tests/test_workflow_untrusted_output.py` runs each of these
      # blocks both ways rather than trusting a claim about somebody else's runner.
      #
      # ── Fenced rather than sanitised, and that is a decision ─────────────────────────────────
      #
      # `claude --version` inside the advisory step is squashed at capture, because it is
      # interpolated into lines emitted outside the fence. Nothing here can take that route: a
      # gate's output is what a human reads when the gate is red, and spacing `##[` apart or
      # collapsing newlines would trade a forging problem for an unreadable failure. Inside a fence
      # the log is byte-identical to what the validator printed.
      #
      # If the shell dies between the two fence lines the fence stays open and later annotations
      # are suppressed. That is the right way to fail here -- an annotation lost rather than one
      # forged -- and it is why no `trap` closes the fence: a trap that fires on an unexpected
      # death would re-enable command processing at exactly the moment nobody knows what state the
      # step is in.
      #
      # ── Caching the pinned install (#299) ────────────────────────────────────────────────
      #
      # `npm install -g @anthropic-ai/claude-code@<pin>` resolves the ~320MB platform-native ELF as
      # one of the package's ordinary `optionalDependencies` -- see "Notes on the install and the
      # platform" above -- so it lands in npm's own package cache (`~/.npm` on this runner) exactly
      # like any other resolved tarball. A cache hit here means the install step below reads that
      # tarball off disk instead of fetching it from the registry.
      #
      # The key is the whole point, not decoration: it is DERIVED from CLAUDE_CLI_VERSION, the same
      # env var the gate is already pinned to, so a version bump misses the cache BY CONSTRUCTION.
      # A cache keyed on anything else -- a hash of this file, a fixed string -- could go on serving
      # a stale CLI after a pin bump, which would be worse than the 320MB this exists to save: a
      # green leg that validated against a version nobody is shipping. `runner.os` is included on
      # the same principle even though this job only ever runs on `ubuntu-latest` (see the file
      # header): the cache path is platform-specific and a key that already carries the axis costs
      # nothing today and is correct the day this job's `runs-on` changes.
      - name: Cache the pinned Claude Code CLI's npm download
        id: cache-claude-cli-npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-claude-cli-${{ runner.os }}-${{ env.CLAUDE_CLI_VERSION }}

      # A miss and a restore must not render identically in the log -- a caching regression (the
      # key stops matching, or the action itself silently no-ops) has to be visible on its own,
      # not inferred from how long the next step happened to take. `cache-hit` is only `true` on an
      # EXACT key match, which is the only kind this step's key can produce (no `restore-keys`), so
      # the two-way read below is complete.
      - name: Report the CLI download cache status
        run: |
          if [ "${{ steps.cache-claude-cli-npm.outputs.cache-hit }}" = "true" ]; then
            echo "npm download cache HIT for CLAUDE_CLI_VERSION=${CLAUDE_CLI_VERSION} -- the install below should not re-fetch the platform binary from the registry."
          else
            echo "npm download cache MISS for CLAUDE_CLI_VERSION=${CLAUDE_CLI_VERSION} -- installing fresh (a cold cache, or the first run after a pin bump)."
          fi

      # See test_every_step_that_runs_the_cli_contains_what_it_prints,
      # test_a_gate_step_reports_the_cli_failure_through_its_fence, and
      # test_removing_the_exit_line_lets_a_failing_gate_report_success.
      - name: Install the pinned Claude Code CLI
        run: |
          set -u
          fence="requivo-cli-$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -dc 'a-f0-9')"
          # A token the fenced text could guess would let it resume command processing and then
          # forge, so a machine with no readable /dev/urandom gets a worse token rather than an
          # empty one -- and says so by being a different shape.
          [ -n "${fence#requivo-cli-}" ] || fence="requivo-cli-noentropy-$$-${RANDOM}${RANDOM}"
          echo "::stop-commands::${fence}"
          code=0
          { npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}" && claude --version; } || code=$?
          echo "::${fence}::"
          exit "$code"

      # The gate. Both manifests, both strict. The plugin manifest is the one a marketplace
      # review runs the same check on; the catalog is the one our own install path reads.
      - name: Validate the plugin manifest (gate)
        run: |
          set -u
          fence="requivo-gate-$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -dc 'a-f0-9')"
          [ -n "${fence#requivo-gate-}" ] || fence="requivo-gate-noentropy-$$-${RANDOM}${RANDOM}"
          echo "::stop-commands::${fence}"
          code=0
          claude plugin validate --strict ./plugins/claude-code || code=$?
          echo "::${fence}::"
          exit "$code"

      - name: Validate the marketplace catalog (gate)
        run: |
          set -u
          fence="requivo-gate-$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -dc 'a-f0-9')"
          [ -n "${fence#requivo-gate-}" ] || fence="requivo-gate-noentropy-$$-${RANDOM}${RANDOM}"
          echo "::stop-commands::${fence}"
          code=0
          claude plugin validate --strict . || code=$?
          echo "::${fence}::"
          exit "$code"

      # Advisory only — see point 4 above. This step must never fail the job; what it
      # produces is an annotation on the run.
      #
      # Three outcomes, and the third one is the point. `claude plugin validate` exits 1
      # for a real refusal, for a path it could not find, and for a missing argument alike
      # — measured, not assumed — so an exit code cannot tell "the newer CLI disagrees
      # with our manifest" from "the validator did not work". Reading only the code, both
      # render as spec drift, and a reader of the annotation is then confident about a
      # question nobody answered. So the verdict is taken from what the tool *said*: a run
      # that printed neither "Validation passed" nor "Validation failed" did not reach a
      # verdict, and that is reported as could-not-look rather than folded into either
      # side. Could-not-look is NOT a clean result and says so.
      - name: Spec drift against the current CLI (advisory, never fails)
        continue-on-error: true
        run: |
          set -u
          if ! npm install -g "@anthropic-ai/claude-code@latest"; then
            echo "::warning title=Drift check could not look::npm could not install the current Claude Code CLI, so nothing was compared against the pinned ${CLAUDE_CLI_VERSION}. This is not a clean result — the drift question is unanswered for this run."
            exit 0
          fi
          latest="$(claude --version 2>/dev/null || echo 'unknown')"
          # Both halves at capture, on one line, because this value is a third-party binary's stdout
          # and it is interpolated into six lines below that begin at column 0 -- all of them outside
          # the fence. Squashing here is what makes every use site safe instead of each of the six
          # having to remember which of the two forms can reach it.
          #
          # The newline is what a `::` command needs: a `::` mid-line is data, and inside one of our
          # own annotations it is doubly inert, since the parser has already taken the line as our
          # command and everything past the second `::` is data. The `##[` is the other form and it
          # is UNANCHORED -- `message.IndexOf("##[")`, no start-of-line test -- so squashing alone
          # would leave `##[error]` parsed out of the middle of the plain `pinned=` echo below. It is
          # spaced apart rather than deleted, so the value still reads as what the tool printed.
          # See test_removing_the_version_squash_lets_the_version_string_forge_one.
          latest="$(printf '%s' "$latest" | tr '\t\r\n' '   ' | sed 's/##\[/## [/g')"
          echo "pinned=${CLAUDE_CLI_VERSION}  latest=${latest}"

          # Everything the loop below prints was written by a third-party binary, and a CI log is
          # parsed: `::name::` at the start of a line -- after the runner trims leading whitespace,
          # so indenting contains nothing -- and the legacy `##[name]` form anywhere in a line, so
          # collapsing onto one line contains nothing either. Both would also cost the readability
          # the annotations below ask a reader for. So the output is printed verbatim inside a
          # fence, between which the runner parses no workflow command at all, in either form, at
          # any column. If the shell dies inside the fence, commands stay off for the rest of the
          # step: an annotation is lost rather than forged, which is the right way to fail here.
          # See test_the_validator_output_cannot_forge_a_workflow_command.
          fence="requivo-drift-$(od -An -N16 -tx1 /dev/urandom 2>/dev/null | tr -dc 'a-f0-9')"
          # A token the fenced text could guess would let it resume command processing and then
          # forge, so a machine with no readable /dev/urandom gets a worse token rather than an
          # empty one -- and says so by being a different shape.
          [ -n "${fence#requivo-drift-}" ] || fence="requivo-drift-noentropy-$$-${RANDOM}${RANDOM}"

          drift=0
          unreadable=0
          echo "::stop-commands::${fence}"
          for target in ./plugins/claude-code .; do
            if out="$(claude plugin validate --strict "$target" 2>&1)"; then
              printf '%s\n' "$out"
              # Exit 0 with no "Validation passed" line is not a pass we can vouch for.
              printf '%s' "$out" | grep -q 'Validation passed' || unreadable=1
            else
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -q 'Validation failed'; then
                drift=1
              else
                unreadable=1
              fi
            fi
          done
          echo "::${fence}::"

          if [ "$unreadable" -ne 0 ]; then
            echo "::warning title=Drift check could not look::The current CLI (${latest}) did not reach a readable verdict on at least one manifest — it printed neither 'Validation passed' nor 'Validation failed'. Read the step output. This is not a clean result, and it is not evidence of drift either."
          elif [ "$drift" -ne 0 ]; then
            echo "::warning title=Plugin spec drift::The manifests pass under the pinned CLI ${CLAUDE_CLI_VERSION} but are refused by ${latest}. This is advisory and did not fail the build. Read the output above, fix the manifest if the newer CLI is right, then bump CLAUDE_CLI_VERSION in .github/workflows/plugin-validate.yml."
          else
            echo "No drift: both manifests are clean under ${latest} as well."
          fi
          exit 0

  # ── The plugin against a RELEASED CLI (#96) ───────────────────────────────────────────────
  #
  # The job above measures two static manifests against a spec. This one measures something no test
  # in `tests/` can. `tests/test_plugin.py::test_skills_reference_only_real_cli_commands` resolves
  # the skills' `requivo` invocations against `requivo.cli._build_parser()` **in the same working
  # tree** — so the plugin and the CLI it is checked against are the same commit, and the comparison
  # is green by construction.
  #
  # A user installs two artifacts that have never been compared with each other. The plugin comes
  # from a marketplace, and a community listing pins it to a commit SHA that Anthropic's CI advances
  # as commits land — so the plugin a stranger installs is routinely `main`. The CLI comes from
  # `uv tool install requivo`, which is the last PyPI release. Between releases the two drift by
  # construction, and until this leg nothing measured the gap.
  #
  # ── Advisory, and unlike the job above there is no gate half ───────────────────────────────
  #
  # The job above is a pinned gate plus an advisory `@latest` run. This is the same argument
  # reaching a different answer, and the difference is worth writing down rather than leaving a
  # reader to think the two jobs disagree by accident.
  #
  # Advisory for the same reason as the step above: this repo's normal state between releases is a
  # pull request that adds a CLI verb and a skill using it, *before* the next release exists on
  # PyPI. A red there would be correct about the world and un-actionable by the author, whose only
  # remedy is to cut a release. A required check that reddens for reasons the author cannot act on
  # is a check that gets overridden, then ignored, then deleted.
  #
  # No gate half, because nothing here is worth pinning. Pinning the released CLI to a version we
  # choose reddens exactly as often; pinning it to the branch reproduces `tests/test_plugin.py` and
  # its tautology. What this leg measures is a lag this project runs on purpose, not a disagreement
  # that picking a version could settle — so it is advisory all the way down.
  #
  # The one place a gate would be meaningful is the release gate, where plugin and CLI are about to
  # become the same commit and drift ought to be zero. That is a different check in a different
  # file and is not built here.
  #
  # ── Three states, and the third is not a pass ──────────────────────────────────────────────
  #
  # `scripts/plugin_cli_drift.py` exits 0 resolved / 1 drift / 3 could-not-look — skipping 2, which
  # `argparse` spends on a usage error, so a run that never reached a verdict cannot be reported as
  # one. The policy of not failing the build lives here rather than in the script, so changing it is
  # one reviewed line.
  # `could-not-look` — PyPI unreachable, no release published, the install failed, or the plugin tree
  # could only be walked in part (#139) — is annotated as its own thing: a released CLI read as an
  # empty verb set would report every invocation as drift, and read as a pass would hide the check
  # being broken. The partial walk is the same argument one layer down: a verdict over the files the
  # process happened to be allowed to open is not a verdict about the plugin.
  #
  # The logic is in `scripts/` and tested in `tests/test_plugin_cli_drift.py`, not written into
  # this shell. A check that exists only in YAML is one the next skill added drops silently, which
  # is exactly what #93 turned out to be for six skills.
  #
  # `ubuntu-latest` only, for the reason the file header already gives: what is compared is two
  # argparse verb trees, a property of the packages rather than of the OS reading them.
  #
  # The workflow's display name still reads "Plugin manifests" and is deliberately not renamed.
  # It costs a reader nothing, and renaming CI identifiers is the class of change `ci.yml`'s header
  # records going wrong twice.
  drift:
    name: Plugin vs released CLI (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # The tree side. `-e .` rather than `.[dev]`: the probe imports `requivo.cli` and nothing else.
      #
      # `continue-on-error` here too, and it is not decoration. This install resolves `pydantic` and
      # `python-dotenv` from PyPI, so it needs the network exactly as the released-side install does,
      # and without this a transient index failure reddens a job whose whole contract is that it
      # never fails. The script already has the right answer for a tree it cannot introspect: it is
      # could-not-look, reported in those words, and explicitly not evidence of drift.
      - name: Install this checkout (the tree side)
        continue-on-error: true
        run: pip install -e .

      # The released side, in an interpreter of its own so neither install can shadow the other.
      # Failure is tolerated on purpose — an unreachable PyPI or an unpublished package is
      # could-not-look, and the script is what reports it in those words.
      - name: Provision the last released requivo from PyPI
        continue-on-error: true
        run: |
          set -u
          python -m venv /tmp/released
          /tmp/released/bin/pip install --disable-pip-version-check --quiet requivo
          /tmp/released/bin/python -c "import importlib.metadata as m; print('released requivo', m.version('requivo'))"

      # Never fails the job. `continue-on-error` and the trailing `exit 0` are both deliberate: the
      # first covers the shell dying on something unforeseen, the second covers the script's own
      # non-zero states, which are verdicts rather than failures.
      - name: Resolve the plugin's invocations against it (advisory, never fails)
        continue-on-error: true
        run: |
          set -u
          if python scripts/plugin_cli_drift.py --released-python /tmp/released/bin/python --github; then
            code=0
          else
            code=$?
          fi
          case "$code" in
            0) echo "Resolved: every invocation the plugin makes exists in the released CLI." ;;
            1) echo "Drift, annotated above. Advisory: this did not fail the build. If the missing verbs ship in the next release, no action is needed; if they were removed from the CLI, the plugin is broken for anyone installing today." ;;
            3) echo "Could not look, annotated above. This is not a clean result and it is not evidence of drift either." ;;
            2) echo "::warning title=Plugin/CLI drift check could not look::scripts/plugin_cli_drift.py exited 2, which is argparse's usage error: this step called it wrong, so nothing was compared and the script never annotated anything. Not a clean result. Fix the invocation in .github/workflows/plugin-validate.yml." ;;
            *) echo "::warning title=Plugin/CLI drift check could not look::scripts/plugin_cli_drift.py exited ${code}, which is none of its states (0 resolved / 1 drift / 3 could-not-look, 2 argparse usage). Nothing was compared. This is not a clean result." ;;
          esac
          exit 0
