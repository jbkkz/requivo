# The lean ratchet (#553): ceilings, not targets. Every value is what `scripts/prose_measure.py`
# measured on the real tree when its PR was opened, rounded up by at most 5%, and read by
# `test_the_tree_stays_within_its_lean_budget`, which reports every breach at once. Lowering one is a
# one-line PR; raising one is legal and visible, and costs the PR one sentence here saying why the
# tree needed to grow. The estate's membership is `ESTATE_FILES` in tests/test_source_form.py.
#
# Last measured 2026-09-23 on 627-t5-docs-scripts (#627, tranche 5 of 5: docs/decisions, docs/ and scripts/).

[src]
# src/requivo, .py files. Measured after #627's tranche 2 cut src/ prose by the rule.
prose_share_max = 0.196
largest_module_max_lines = 1304
module_docstring_max_lines = 15
function_docstring_max_lines = 12

[tests]
# tests/, .py files. `largest_module_max_lines` excludes the meta-guard estate. Measured 2026-09-23 after
# #627's tranche 4 cut tests/ code to one file per subject (ratio 1.61x, largest module 670 lines);
# `function_docstring_max_lines` is the rule's own five-line ceiling (`decision: the-tree-records-the-rule`),
# measured at 2 on this tree.
ratio_max = 1.68
largest_module_max_lines = 700
module_docstring_max_lines = 4
function_docstring_max_lines = 5

[estate]
# The tests that guard the repo's own self-description rather than its runtime, summed. #627's
# tranche 3 removed the guards that only guarded prose and slimmed the rest to their runtime rules.
total_max_lines = 2899

[docs]
# `decision_record_max_lines`: #627's tranche 5 rewrote every record to Context / Decision / Cost /
# Alternatives; the longest (0004, the HTTP API facade, eight numbered sub-decisions) measured 80.
compatibility_max_lines = 418
decision_record_max_lines = 84

[scripts]
# scripts/, .py files. Measured after #627's tranche 5 cut scripts/ prose by the src/ rule (41.2% -> 19.5%,
# largest module golden_lib.py at 633 lines, longest module docstring 23, longest function docstring 9).
prose_share_max = 0.204
largest_module_max_lines = 664
module_docstring_max_lines = 24
function_docstring_max_lines = 9

[claude_md]
# CLAUDE.md is loaded into every session; it holds the rules and the map, and nothing else (#627).
max_lines = 125
