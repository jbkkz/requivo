# The lean ratchet (#553) -- ceilings, not targets.
#
# Every value here is what `scripts/prose_measure.py` measured on this repository the moment
# before this file's own PR was opened -- including this PR's own additions (the script, this
# TOML, and the guard section in tests/test_source_form.py), because a ceiling that ignored the
# ratchet's own weight would start life already broken by the thing enforcing it. Rounded up by at
# most 5% from that measurement. None is a round number someone expected and none is an
# aspiration: raise one and the tree has grown past what it measured last time; lower one and the
# tree has gotten leaner than what this file still allows.
#
# This is a FLOOR under today's tree, not a plan for tomorrow's. `tests/test_source_form.py`'s
# lean-budget section reads this file, re-measures, and reports every breach -- file and number,
# never only the first.
#
# - Lowering a ceiling is a one-line PR: a change that gets comfortably under one should be asked
#   to tighten it, so the ratchet keeps meaning something instead of only ever loosening.
# - Raising a ceiling is legal and visible -- a diff on this file -- but it costs the PR one
#   sentence saying why the tree needed to grow there. No silent creep.
#
# No key here was met by rounding to what looked tidy: `src.largest_module_max_lines` and
# `tests.ratio_max` in particular are far from any figure a reader might assume going in --
# `src/requivo/cli.py` is the largest module in `src/`, and the suite still runs at roughly 2.7x
# the product's code even after the CLI tranche of #555 (#582) landed. Measure; do not assume.
#
# Measured 2026-09-14 with #553's own branch merged onto main at 81c909d (#582, the CLI tranche
# of #555, landed after this branch was first opened and before this measurement -- an earlier
# cut of this file measured against a tree missing that commit and every number below was
# re-derived once it was included).

[src]
# src/requivo, .py files, untouched by #553/#582: 44.7% prose (8,340 of 18,666 lines),
# src/requivo/cli.py the largest module at 1,593 lines.
#
# `prose_share_max` starts at exactly the figure the lean pass (#548) set out to reduce -- the
# 2026-08-29 audit found 45%, this tree still measures 44.7%. That is deliberate, not an
# oversight: a ratchet has to start at what the tree *is*, and #549's src/ compression is a
# separate, already-closed lane. Lowering this ceiling once src/ actually shrinks further is the
# one-line PR the header above describes.
prose_share_max = 0.469
largest_module_max_lines = 1672

[tests]
# tests/, .py files. 2.71x test code per line of product code (22,237 test code lines against
# 8,201) -- #582 (the CLI tranche of #555) removed ~530 tests/ lines and the ratio barely moved,
# which is the whole reason this key exists rather than a one-off claim in an issue body.
# Docstring maxima are over every module/class/function docstring found in tests/: 76 lines
# (tests/test_public_payload_shapes.py's module docstring, unmoved by #582) and 26 lines (now a
# function docstring in tests/test_discovery_paid_call_guard_209.py -- #582 deleted the file that
# previously held this key's example, tests/test_cli_untrusted_output.py, and a different
# function of the same length set it instead). #555's remaining tranche (tests/web/) is still in
# flight and will likely lower some of these further -- expected, and the one-line-PR case above.
#
# `largest_module_max_lines` deliberately EXCLUDES the meta-guard estate (see [estate] below):
# tests/test_source_form.py, the estate's own largest file at 2,167 lines, would otherwise pin
# this key nearly 3x over #555's separate 800-line rule for an ordinary test module. Excluding the
# twelve files `ESTATE_FILES` names (tests/test_source_form.py's own lean-budget section owns that
# list), the largest test module is tests/test_plugin_cli_drift.py at 1,153 lines, with
# tests/test_provider.py (1,131), tests/web/test_web_discovery.py (1,015) and
# tests/web/test_web_security.py (843) behind it -- the last two are being split by #555's web
# tranche as this lands, so expect this ceiling to be lowerable again shortly.
ratio_max = 2.84
largest_module_max_lines = 1210
module_docstring_max_lines = 79
function_docstring_max_lines = 27

[estate]
# The meta-guard estate: the tests that guard the repo's own self-description rather than its
# runtime. The file list lives in tests/test_source_form.py, not here (#553 asks for the ceiling
# value here and the membership there, so a file joining or leaving the estate is a test diff, not
# a silent change of what this number means). 4,538 lines across the twelve files named there
# (4,382 on main before #553's own guard section landed; +156 for that section across three review
# rounds -- the estate-exclusion helper and, in the round beside this comment, deriving the
# must-fire test's expected file names from the same measurement instead of hardcoding them; #582
# did not touch any estate file).
total_max_lines = 4764

[docs]
# docs/compatibility.md, untouched by #553 or #582: 399 lines -- already under #552's target of
# <=400, so this ceiling mostly guards against silent regrowth rather than driving a cut.
compatibility_max_lines = 418
