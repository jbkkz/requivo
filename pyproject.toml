[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "requivo"
version = "3.1.0"
description = "Turn a vague product request into a versioned requirements model: ask only the questions that change the solution, generate the brief and PRD from it, and compute exactly what a changed answer invalidates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["requirements", "product", "llm", "anthropic", "claude", "prd", "discovery", "elicitation"]
authors = [{ name = "jbkkz" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core has no LLM dependency: the deterministic engine + CLI + the Claude Code plugin all run with
# just these. The Anthropic SDK is an optional extra (below) — only the API-powered CLI mode needs it.
# Upper bounds on the majors. A dependency's next major is by definition allowed to break us, and
# without a ceiling it does so on a *fresh install of an unchanged Requivo* — the one failure a user
# cannot correlate with anything they did. The floors say what we need; the ceilings say what we have
# actually been run against.
dependencies = [
    "python-dotenv>=1.0.0,<2",
    # 2.11, not 2.0, and the difference is eleven minor versions of a promise nothing tested (#91).
    # The Dependency floor leg found it on its first run: on 2.0.x the package does not import at all
    # — `SerializeAsAny` inside an `Optional[...]` is unhashable under 3.9's `typing`, so every model
    # in `contracts.py` fails to build — and from 2.0.3 up to 2.10 the two guards that pin invariant
    # 8's permissive-mirror graph fail. The v0.11.0 audit checked that `SerializeAsAny` is exported by
    # 2.0.0 and stopped there, which is the whole lesson: a symbol existing is not the symbol working.
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
# API-powered mode: `pip install 'requivo[anthropic]'`. Not needed to use Requivo inside Claude Code.
#
# `<2` rather than `<1`, and per the rule in `.github/dependabot.yml` the widened ceiling is a
# statement that we have run against the new major rather than a bot's guess. What that meant here,
# because CI could not supply it: the whole suite green at 1.2.0 on py3.10-3.13 plus the macOS and
# Windows legs, pyright green, and -- the part no leg reaches, since nothing in CI makes a wire call
# -- one real `discover` and one real rejected-credential run against 1.2.0, checking the paid path
# end to end and the typed-error arms `completion.py` branches on (#201). The token counts came back
# populated, which is the same question #294 asks about the ledger's `getattr` defaults.
#
# The v1 break is the move to the `httpx2` fork plus removals; the SDK surface this provider uses is
# `Anthropic()`, `messages.create`, `.content`/`.stop_reason`/`.usage` and five exception classes,
# and none of it appears in that list. We construct no `httpx` object and pass none in, which is the
# migration's one real edit.
#
# **The interpreter now decides the SDK major.** anthropic 1.x requires Python >=3.10 while this
# package declares >=3.9, so `pip install 'requivo[anthropic]'` resolves 0.x on 3.9 and 1.x above it
# -- correct by construction, and the reason the 3.9 legs and the rest no longer test the same SDK.
# That is an argument for moving the supported-Python window (#298), not against this ceiling.
#
# **The floor moved to 0.42.0 from 0.40.0, found while implementing #294.** `_complete()` bills usage
# through `getattr(u, name, 0) or 0` on four `anthropic.types.Usage` fields, and two of them --
# `cache_read_input_tokens`, `cache_creation_input_tokens` -- were not on that class yet at 0.40.0 or
# 0.41.x (measured directly: `Usage.model_fields` at 0.40.0 is only `{input_tokens, output_tokens}`;
# both cache fields are present from 0.42.0 on). That is not a future rename to guard against -- it
# was already true, silently, for the two oldest versions this extra's declared range let a resolver
# install: `uv pip install --resolution lowest-direct` at the old `>=0.40.0` floor landed exactly
# there, so any install pinned near the floor has been under-reporting cache-read/write spend with
# nothing anywhere going red, on every release since this extra existed. #294's own pin
# (test_usage_field_pin.py) is what surfaced it -- it fails red against a genuine `--resolution
# lowest-direct` install at the old floor and passes at 0.42.0, so raising the floor is the fix
# rather than narrowing the pin down to the two fields that happened to always be there.
anthropic = ["anthropic>=0.42.0,<2"]
# Local, single-user, self-hostable web interface: `pip install 'requivo[web]'`, then `requivo web`.
# A thin FastAPI + Jinja2 + HTMX layer over the same services as the CLI — no Node build, assets ship
# in the wheel. Not required for the CLI or Claude Code. Add [anthropic] too for provider-backed actions.
web = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9,<1"]
# The repository conformance suite (#424): `pip install 'requivo[testing]'` for a consumer building a
# non-file SessionRepository (a Postgres backing, most concretely) who wants to subclass
# `requivo.testing.repository_conformance.SessionRepositoryConformance` in their own pytest suite.
# `requivo.testing` itself always ships in the wheel -- it is part of the declared seam -- but
# *importing* it needs pytest, which the base install deliberately does not carry (nothing else in
# the package needs a test framework at runtime). A consumer writing pytest tests already has pytest;
# this extra exists so the floor this suite is built against is declared rather than assumed.
testing = ["pytest>=8.0"]
# `tomli` is `tomllib` backported, for `scripts/dependency_floor.py` on the 3.9/3.10 legs — the same
# library under its pre-stdlib name, not a second TOML reader. `packaging` is what lets that script
# compare `0.110` with the `0.110.0` pip actually installs as versions rather than as strings. Both
# are dev-only: they are part of how the runtime floors are *measured* (#91), never part of what a
# user installs.
#
# `pyright` (#78) carries an upper bound on the major for the same reason the workflow files pin
# their actions to a tag: a type checker's new release can report on code that has not changed, and
# on a *blocking* leg that turns an unrelated upstream release into a red `main`. The floor is where
# `pythonPlatform: "All"` and the config keys below it are known to behave; dependabot moves both
# where a maintainer can review the move.
#
# Self-referential rather than restating the five pins from `anthropic` and `web`: a duplicated
# ceiling is one that can move on one side only, and CI would then test a dependency set no user
# can install -- invisible until somebody hits the gap, which is the failure shape the floor leg
# exists to prevent for versions. Needs pip>=21.2 / setuptools>=64, both already floors of this
# repo's documented install paths.
# HTTPX 0.25 adds transport socket_options, used by supported Anthropic SDKs.
# 0.23.1 imports on Python 3.13 but fails client construction with SDK 0.49.
# This is a tested dev-only floor, not a new runtime dependency (#312).
# `setuptools>=70.1.0`, NOT the `[build-system]` floor above (`>=64`) -- this is a second, higher
# pin, deliberately, and the divergence is the point rather than an oversight.
#
# The two numbers answer different questions. `[build-system].requires` is what `pip` resolves
# *fresh* inside an isolated build environment when installing this package from source -- the
# Dependency floor leg's `--resolution lowest-direct` governs the *installed* environment, not that
# ephemeral one, so `>=64` there was never actually exercised at the literal floor and stayed fine.
# This line is a *direct* `dev`-extra dependency instead: the floor leg installs it at the literal
# floor, and PR #453's CI run put a real number on what that costs -- `setuptools==64.0.0` under
# Python 3.12 crashes `import pkg_resources` itself (`AttributeError: module 'pkgutil' has no
# attribute 'ImpImporter'`, from `pkg_resources/__init__.py`'s own `register_finder` call), before
# `tests/test_sdist_contents_431.py`'s or `tests/test_repository_conformance_424.py`'s own assertions
# ever run -- not a defect in what those tests check, but the declared floor being unable to build
# *anything* on the newer end of this project's own supported Python range (3.12 is a declared
# classifier). Bisected directly against Python 3.12.13/3.12.14 rather than guessed: 64.0.0 through
# 66.0.0 all crash identically; 66.1.0 is the first release whose `pkg_resources` guards the
# now-removed `pkgutil.ImpImporter` and builds a correct sdist. `build_wheel` needs one version more:
# below 70.1.0 `bdist_wheel` is not a setuptools command at all without a separately installed `wheel`
# package (this project declares none), and 70.1.0 is where the command is vendored in directly --
# confirmed on a bare venv with no `wheel` installed. `70.1.0` is therefore the lowest floor that
# builds both a real sdist and a real wheel on Python 3.12 with nothing else added, still declaring
# `python_requires>=3.8` itself so this project's own 3.9 floor is untouched.
#
# dev-only: `tests/test_sdist_contents_431.py` and `tests/test_repository_conformance_424.py` call
# `setuptools.build_meta.build_sdist()`/`build_wheel()` in-process to prove what `MANIFEST.in` and
# the package-data config actually ship; nothing at runtime imports setuptools. Both tests also
# degrade to a named skip (`_setuptools_build_backend_reason` in the sdist test file, reused by the
# wheel one) if the installed setuptools is too old to import safely -- checked through
# `importlib.metadata.version("setuptools")`, deliberately never `import setuptools` itself, because
# a first version of this check (caught by a spawned reviewer, not by CI) read the version by
# importing setuptools first, which is exactly the operation that crashes on 64.0.0-66.0.0 under
# Python 3.12 -- so the guard never actually fired for the one range it existed to catch. This floor
# is what keeps that skip from firing on any CI leg today; the skip itself is what keeps a *future*
# incompatible combination (an interpreter newer than any tested here, a consumer's own older pin)
# from turning into a bare traceback in fixture setup instead of a legible, named gap.
#
# `testing` joined the self-reference above (#424) rather than restating `pytest>=8.0` as a fourth
# direct pin here -- the same reasoning, one extra later.
#
# **`httpx>=0.26.0`, not 0.25.0, and the floor leg is the only thing that can see why (#472).**
# `httpx` is a direct dependency, so `--resolution lowest-direct` installs it at its floor;
# `httpx 0.25.0` pins `httpcore>=0.18.0,<0.19.0`, and `httpcore 0.18.0` reads `anyio.abc` at
# import time. `anyio` is transitive, so the same resolution leaves it at newest -- which the
# floor leg states as the deliberate shape of the promise, ours to hold below, not above. On
# 2026-09-03 `anyio 4.15.0` stopped exposing `anyio.abc` through its lazy `__getattr__`, and
# `import httpx` began raising `AttributeError` on the floor leg while every other leg stayed
# green: the 3.9 legs cap `anyio` at 4.12.1, where the old pair still works, so only the 3.12
# floor resolve could reach it. Bisected, not guessed: 0.26.0 is the lowest release that
# resolves to `httpcore 1.x` and imports cleanly under `anyio 4.15.0`.
#
# No upper bound was added to `anyio`. Holding a transitive bound would reverse the decision
# `.github/workflows/ci.yml` already records in prose, to fix one release of one package.
# `httpx` is test-only here -- `fastapi.testclient` and the wheel leg smoke test -- and nothing
# shipped imports it, so raising this floor costs a consumer nothing.
dev = ["requivo[anthropic,web,testing]", "ruff>=0.6", "httpx>=0.26.0,<1",
       "tomli>=1.1.0; python_version < '3.11'", "packaging>=23.0",
       "pyright>=1.1.400,<2", "setuptools>=70.1.0"]

[tool.pyright]
# #78. Ruff and pytest were the whole static story, on a codebase whose architectural safety is
# expressed in types rather than in assertions: Pydantic contracts at every boundary with
# `StrictModel` and `PersistedEngineOutput` deliberately disagreeing (invariant 8), `Protocol` seams
# that nothing structural checks, and a store where `Optional` means *could not read* rather than
# *empty* — the distinction this whole project is organised around. Ruff looks for none of it, and a
# test finds it only where a test happens to run the path.
#
# Here rather than in `pyrightconfig.json` because JSON has no comments: the first draft carried the
# reasoning in `"//"` keys and pyright reported them as unrecognised settings on every run, which is
# a config that complains about itself. Pyright reads `[tool.pyright]` natively and prefers a
# `pyrightconfig.json` when one exists, so there must not be one.

# Widened from `core/` + `services/` to the whole package (#271): the condition this section used to
# set for widening -- "once these have stayed clean" -- was met. `providers/`, `web/`, `deterministic/`,
# `cli.py`, `usage.py`, `streams.py` and `paths.py` were measured clean (`.venv/bin/pyright
# --outputjson` over each, 0 errors) once `services/discovery.py`'s `Generated.artifact: object` field
# was given a real type (`Generated[T]`, resolved per artifact type by `@overload`s on
# `DiscoveryService.generate`, keyed on the `Literal` string every call site already passes) and two
# narrower SDK-optionality gaps in `providers/anthropic/{client,completion}.py` were fixed.
#
# `render/` was the one exception #271 left behind, on five diagnostics from two `None`-narrowing
# gaps in `render/html.py` believed to be false positives -- and *believed* was the whole of it. Both
# were checked in #393 and both were right, so each is now an `assert` that states, at the site that
# depends on it, the fact somewhere else in the file that makes it sound: `_INLINE_MARKUP` has only
# named alternation branches, and `markdown_to_html` gathers a list line only when one of the two
# item patterns matched it. A `# type: ignore` would have bought the same 0 errors and preserved
# neither fact. `test_every_inline_markup_branch_is_a_named_group_with_a_tag` and
# `test_a_list_line_that_matches_neither_marker_is_refused_by_name` are what go red when either
# moves. Every directory of the shipped package is checked now, and there is no un-scoped one left
# to write a successor condition for.
include = ["src/requivo"]

# The floor `requires-python` declares, not the interpreter the leg happens to run. A checker at 3.12
# accepts what the oldest supported interpreter refuses, which is the same shape of unverified claim
# the Dependency floor leg exists for (#91).
#
# **And it is a claim about symbols, not about signatures** (#470). Typeshed version-gates whole
# names and does not gate individual *parameters*, so `pythonVersion` has nothing to bite on for a
# keyword a newer interpreter added to a function that has always existed. Measured, not assumed:
# `pyright --pythonversion 3.9` reports 0 errors on `Path("x").write_text("a", newline="")`, the
# 3.10+ keyword #469 shipped, which then failed 518 tests apiece on the three 3.9 legs. Whoever reads
# the paragraph above as a guarantee that the floor is checked will be wrong in exactly that way.
# The two instances this repo has actually met are covered by a test rather than by this setting --
# `test_no_text_call_passes_a_keyword_the_declared_floor_rejects` in `tests/test_encoding.py`, whose
# table is deliberately two rows long, per CLAUDE.md's bar on funding coverage from named instances.
pythonVersion = "3.9"

# `All` is the stricter setting, not a convenience. It type-checks the Windows-only locking path from
# the Linux leg, on a codebase bitten by Windows-only behaviour three times (invariants 17 and 18).
# Left at the host's platform it reported `msvcrt.locking` as missing — a fact about the machine
# running the check, not about the code.
#
# Its limit is the same one, one setting along, and it was measured while answering #470 rather than
# left as the "unknown" that issue recorded. Typeshed's *platform* gating is complete where its
# version gating is: at the level of a symbol, and not at the level of a parameter.
#   - symbol, both directions, caught: `os.startfile` under `--pythonplatform Linux` and `os.getuid`
#     under `--pythonplatform Windows` each report `reportAttributeAccessIssue`.
#   - parameter, not caught: `subprocess.run(..., preexec_fn=...)` under `--pythonplatform Windows`
#     reports 0 errors, and CPython raises `ValueError("preexec_fn is not supported on Windows ...")`
#     there.
# So the answer for both keys is one sentence: **this leg checks that a name exists on the declared
# floor and platform; it does not check that a signature does.** No guard is added for the platform
# half, because unlike the version half this repo has met zero real instances of it, and one
# plausible class does not fund coverage here (CLAUDE.md, #288).
pythonPlatform = "All"

typeCheckingMode = "basic"

# The `.venv` this project's own install instructions create and `uv run` uses. Without it pyright
# resolves against whatever python is first on PATH, `pydantic` reads as an unresolved import, and
# four real errors hide behind noise. The CI leg builds the same layout rather than installing to the
# runner's interpreter, so the command a maintainer types locally is the command the leg runs — a
# check only its own leg can run is verified by nothing but the leg it feeds.
venvPath = "."
venv = ".venv"

[project.urls]
Homepage = "https://requivo.com"
Repository = "https://github.com/jbkkz/requivo"
Changelog = "https://github.com/jbkkz/requivo/blob/main/CHANGELOG.md"

[project.scripts]
requivo = "requivo.cli:app"

[tool.setuptools]
# NOTICE and THIRD-PARTY-NOTICES.md ride along with the license into the wheel's dist-info. NOTICE is
# not decoration: Apache-2.0 section 4(d) requires a redistribution to carry the NOTICE file, and a
# wheel is a redistribution, so omitting it here would put every `pip install` out of compliance with
# the licence this file declares. THIRD-PARTY-NOTICES.md is here for a different reason — the wheel
# carries a verbatim copy of htmx, and a redistributed file should be traceable to its source and
# version even though its licence (0BSD) asks for nothing. Kept as the setuptools-specific key rather
# than PEP 639's `[project] license-files`, which would raise the build-time setuptools floor and the
# metadata version; whether that trade-off still binds is #337, deliberately not settled here.
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]

# The sdist deliberately ships no tests/ (#431): MANIFEST.in `prune`s it rather than shipping a
# half-collectable copy (the default sdist file-finder pulled in tests/*.py without the underscore
# helpers, conftest.py, tests/web/, scripts/ or fixtures/ those tests need to even collect — verified
# against the actual PyPI 3.0.0 artifact). The wheel-install CI job and the publish gates are what
# verify a built artifact; a distro packager runs the wheel, not a re-assembled copy of this suite.
# See docs/compatibility.md and tests/test_sdist_contents_431.py.
[tool.setuptools.packages.find]
where = ["src"]
include = ["requivo*"]

[tool.setuptools.package-data]
# Ship the engine's assets (prompts, framework schema, context cards, demo payload) inside the wheel,
# plus the web interface's templates and static files (CSS/JS + the vendored HTMX — no CDN at runtime).
# Without this, a `pip install` outside the clone would have no prompts/schema (every prompt-building
# command fails) and `requivo web` would 500 on a missing template. The wheel-install CI job guards it.
# `py.typed` is the PEP 561 marker (#423): an empty file whose presence, not content, tells a type
# checker that requivo ships its own inline types rather than needing a stub package. Nothing reads
# it at import time -- `tests/test_public_seam_423.py` is what would go red if it stopped shipping.
requivo = ["assets/**/*", "web/templates/**/*", "web/static/**/*", "py.typed"]

[tool.ruff]
line-length = 120
target-version = "py39"
# `out` is the retired output root. `.oss` is vendored: /oss:scaffold replaces those files wholesale
# on every run, so a finding there cannot be fixed — it comes back on the next refresh. CI already
# scopes its own call (`ruff check src tests scripts`); this puts that scope in the tool's config,
# where anything else linting the tree can see it too.
extend-exclude = ["out", ".oss"]

[tool.ruff.lint]
# Real problems (F/B/E9), style (E/W), import order (I), modern-syntax nudges (UP).
# E501 (line width) is intentionally off: the codebase uses deliberate alignment and long,
# self-contained strings; CI-lint is here to catch bugs, not to police width.
select = ["E", "F", "I", "W", "UP", "B"]
# E501 (line width): off — deliberate alignment + long self-contained strings.
# UP045 (Optional[X] → X | None): off — the project targets Python 3.9, where Pydantic must *evaluate*
# model-field annotations at class-definition time, and `X | None` raises TypeError there (unlike
# deferred function annotations). Pydantic model fields therefore use `Optional[X]` by necessity.
ignore = ["E501", "UP045"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults on purpose; they are the
# documented exception to B008 (function-call-in-default-argument), not a bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.isort]
# Keep the codebase's compact import style: pack sorted members onto as few lines as fit the width,
# instead of exploding one-per-line on a trailing comma.
split-on-trailing-comma = false
